readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.14.3",
    "colorlog",
    "notion-client==3.0.0",
    "playwright==1.58.0",
    "python-dotenv==1.2.1",
]
